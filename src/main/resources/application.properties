spring.application.name=medical-clinic

spring.datasource.url=jdbc:postgresql://localhost:5433/clinic
spring.datasource.username=clinicUsr
spring.datasource.password=clinic123
spring.datasource.driver-class-name=org.postgresql.Driver

# Dokumentacja API włączona w środowisku deweloperskim
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG

# Maksmalny rozmiar strony
spring.data.web.pageable.max-page-size=100
logging.level.com.github.erneo97.medical_clinic=DEBUG

logging.pattern.correlation=[%X{requestId}]
logging.file.name=logs/medical-clinic.log